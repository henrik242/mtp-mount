<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#53B6FF"/>
      <stop offset="1" stop-color="#0E63E6"/>
    </linearGradient>
    <linearGradient id="screen" x1="392" y1="300" x2="632" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B4FC0"/>
      <stop offset="1" stop-color="#0A3C95"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- device (portrait) -->
  <rect x="356" y="250" width="312" height="524" rx="56" fill="#FFFFFF"/>
  <rect x="392" y="312" width="240" height="372" rx="22" fill="url(#screen)"/>
  <!-- speaker + home indicator -->
  <rect x="476" y="286" width="72" height="12" rx="6" fill="#CFE4FF"/>
  <rect x="470" y="716" width="84" height="14" rx="7" fill="#9FC6FF"/>

  <!-- mount arrow rising out of the device screen -->
  <g fill="#FFFFFF">
    <rect x="486" y="470" width="52" height="150" rx="14"/>
    <path d="M512 376 L600 492 L424 492 Z"/>
  </g>
</svg>
