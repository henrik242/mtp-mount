name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Compile check on every push/PR. No secrets, no signing.
  build:
    name: Build (unsigned compile check)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen libmtp
      - name: Toolchain
        run: xcodebuild -version && sw_vers
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (signing disabled)
        run: |
          xcodebuild -project MtpMount.xcodeproj -scheme MtpMount \
            -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

  # Decide whether the signed release job should run: only on a v* tag AND only
  # when the signing secret is configured (so forks/PRs never attempt it).
  gate:
    name: Gate release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - id: decide
        env:
          HAS_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # Signed + notarized DMG, attached to the GitHub Release. Uses secrets.
  release:
    name: Signed notarized DMG
    needs: [build, gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-26
    permissions:
      contents: write # create/attach release assets
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen libmtp

      - name: Import certificate to a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "BUILD_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          # Make the temp keychain searchable alongside the login keychain.
          security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db"

      - name: Install provisioning profiles
        env:
          PROFILE_APP_BASE64: ${{ secrets.PROVISIONING_PROFILE_APP_BASE64 }}
          PROFILE_EXT_BASE64: ${{ secrets.PROVISIONING_PROFILE_EXT_BASE64 }}
        run: |
          set -euo pipefail
          # Xcode 16+ reads UserData/Provisioning Profiles; older Xcode reads
          # MobileDevice. Install into both.
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            printf '%s' "$PROFILE_APP_BASE64" | base64 --decode > "$DIR/app.provisionprofile"
            printf '%s' "$PROFILE_EXT_BASE64" | base64 --decode > "$DIR/ext.provisionprofile"
          done

      - name: Write notary API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release (signed)
        run: |
          xcodebuild -project MtpMount.xcodeproj -scheme MtpMount \
            -configuration Release -derivedDataPath build-release build

      - name: Bundle libmtp, sign, notarize, DMG
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          APP="build-release/Build/Products/Release/MtpMount.app"
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bundle-and-sign.sh "$APP" --timestamp
          ./scripts/make-dmg.sh "$APP" "dist/MtpMount-$VERSION.dmg" --notarize

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MtpMount-dmg
          path: dist/*.dmg

      - name: Attach DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber

      - name: Clean up secrets
        if: always()
        run: |
          security delete-keychain "${BUILD_KEYCHAIN:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            rm -f "$DIR/app.provisionprofile" "$DIR/ext.provisionprofile"
          done
