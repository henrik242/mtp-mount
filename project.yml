name: MtpMount
options:
  bundleIdPrefix: no.synth.mtpmount
  # Apple Silicon only, latest macOS. The bundled libmtp/libusb come from
  # Homebrew bottles built for the CI runner's OS, so this must not be lower
  # than that OS (see .github/workflows/ci.yml, runs-on).
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    DEVELOPMENT_TEAM: 358L7UXVJ4
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    PRODUCT_NAME: "$(TARGET_NAME)"
    # debug-dylib/preview indirection breaks out-of-process extension loading
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_PREVIEWS: NO

targets:
  MtpMount:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.synth.mtpmount
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "MtpMount App DevID"
    dependencies:
      - target: MtpMountFileProvider
        embed: true
      # Embed the libmtp helper into Contents/MacOS. The app installs a per-user
      # LaunchAgent pointing here and bootstraps it via launchctl at runtime.
      - target: garmin-mtp-agent
        embed: true
        copy:
          destination: executables

  MtpMountFileProvider:
    type: app-extension
    platform: macOS
    sources: [Extension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.synth.mtpmount.fileprovider
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "MtpMount FileProvider DevID"

  garmin-mtp-agent:
    type: tool
    platform: macOS
    sources:
      - path: Agent
        excludes:
          - "CLibmtp/**"
          - "*.plist"
      - path: Shared/MtpXPC.swift
      - path: Shared/Ids.swift
    settings:
      base:
        PRODUCT_NAME: garmin-mtp-agent
        PRODUCT_BUNDLE_IDENTIFIER: no.synth.mtpmount.helper
        CODE_SIGN_ENTITLEMENTS: Agent/Agent.entitlements
        # Embedded Info.plist (__TEXT,__info_plist) gives the helper a stable
        # bundle id, which is also its code-signing identifier.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Agent/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Non-sandboxed tool; no provisioning profile needed (no profile-restricted
        # entitlements). Developer ID signing + hardened runtime only.
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Find the CLibmtp module map, the libmtp headers, and the dylib.
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Agent/CLibmtp"
        LIBRARY_SEARCH_PATHS: /opt/homebrew/lib
        OTHER_SWIFT_FLAGS: "-Xcc -I/opt/homebrew/include"
        OTHER_LDFLAGS: "-lmtp"
        # So the bundled libmtp/libusb in Contents/Frameworks are found at runtime
        # (see scripts/bundle-and-sign.sh, which rewrites the link paths to @rpath).
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          # Unbundled debug helper loads Homebrew's libmtp (other team's signature).
          CODE_SIGN_ENTITLEMENTS: Agent/Agent-Debug.entitlements
