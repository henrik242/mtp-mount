name: MtpMount
options:
  bundleIdPrefix: no.synth.mtpmount
  # Apple Silicon only. The agent talks to devices with IOUSBHost (a system
  # framework), so there are no third-party dylibs and no minimum-OS floor
  # beyond the APIs used.
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    DEVELOPMENT_TEAM: 358L7UXVJ4
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    PRODUCT_NAME: "$(TARGET_NAME)"
    # debug-dylib/preview indirection breaks out-of-process extension loading
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_PREVIEWS: NO

targets:
  MtpMount:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.synth.mtpmount
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "MtpMount App DevID"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [MtpMountTests]
    dependencies:
      - target: MtpMountFileProvider
        embed: true
      # Embed the helper into Contents/MacOS. The app installs a per-user
      # LaunchAgent pointing here and bootstraps it via launchctl at runtime.
      - target: mtpmount-agent
        embed: true
        copy:
          destination: executables

  MtpMountFileProvider:
    type: app-extension
    platform: macOS
    sources: [Extension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.synth.mtpmount.fileprovider
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "MtpMount FileProvider DevID"

  mtpmount-agent:
    type: tool
    platform: macOS
    sources:
      - path: Agent
        excludes:
          - "*.plist"
      - path: Shared/MtpXPC.swift
      - path: Shared/Ids.swift
    settings:
      base:
        PRODUCT_NAME: mtpmount-agent
        PRODUCT_BUNDLE_IDENTIFIER: no.synth.mtpmount.helper
        CODE_SIGN_ENTITLEMENTS: Agent/Agent.entitlements
        # Embedded Info.plist (__TEXT,__info_plist) gives the helper a stable
        # bundle id, which is also its code-signing identifier.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Agent/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Non-sandboxed tool; no provisioning profile needed (no profile-restricted
        # entitlements). Developer ID signing + hardened runtime only.
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Agent/Agent-Debug.entitlements

  # Logic tests: compiles the platform-independent sources directly (no host
  # app, no USB) and drives AgentService against an in-memory FakeDevice.
  MtpMountTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/MtpXPC.swift
      - Shared/Ids.swift
      - Agent/MtpDevice.swift
      - Agent/AgentService.swift
      - Agent/UsbClass.swift
      - Agent/MTP/PTPCodec.swift
      - Agent/MTP/PTPSession.swift
      - Extension/Model.swift
      - Extension/FileProviderItem.swift
      - Extension/ErrorMapping.swift
      - Extension/FileProviderExtension.swift
      - Extension/AgentClient.swift
      - Extension/Enumerator.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.synth.mtpmount.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        PROVISIONING_PROFILE_SPECIFIER: ""
